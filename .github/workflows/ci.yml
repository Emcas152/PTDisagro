name: CI/CD Pipeline - Feria Disagro

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Verificación de Calidad y Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalar Dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar Contratos Base
        run: pnpm --filter @ptdisagro/contracts build

      - name: Generar Cliente Prisma
        run: pnpm --filter @ptdisagro/api prisma:generate

      - name: Verificación de Tipos (TypeScript Typecheck)
        run: |
          pnpm --filter @ptdisagro/contracts typecheck
          pnpm --filter @ptdisagro/api typecheck

      - name: Ejecutar Pruebas Unitarias y de Negocio (Vitest)
        run: |
          pnpm --filter @ptdisagro/contracts test
          pnpm --filter @ptdisagro/api test

      - name: Compilar Aplicación Backend (NestJS + Fastify)
        run: pnpm --filter @ptdisagro/api build

      - name: Compilar Aplicación Frontend (Next.js 14)
        run: pnpm --filter @ptdisagro/web build

  docker-validation:
    name: Validación de Contenedores Docker
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Validar Sintaxis de Docker Compose
        run: docker compose config
